<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product cards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <div class="product-catalog-image container">
      <div class="registration-form-container">
        <form id="registration-form" class="registration-form">
          <label class="label-title white-text-color" for="name">Введите своё имя:</label>
          <input name="name" id="name" class="input-style" type="text" placeholder="Укажите своё имя..." required>
  
          <label class="label-title white-text-color" for="lastName">Введите свою фамилию:</label>
          <input name="lastName" id="lastName" class="input-style" type="text" placeholder="Укажите свою фамилию..." required>
  
          <label class="label-title white-text-color" for="dateOfBirth">Введите дату рождения:</label>
          <input name="dateOfBirth" id="dateOfBirth" class="input-style" type="date" required>
  
          <label class="label-title white-text-color" for="login">Введите логин:</label>
          <input name="login" id="login" class="input-style" type="text" placeholder="Укажите логин..." required>
  
          <label class="label-title white-text-color" for="password">Введите пароль:</label>
          <input name="password" id="password" class="input-style" type="password" placeholder="Укажите свой пароль..." required>
  
          <label class="label-title white-text-color" for="confirmPassword">Повторите пароль:</label>
          <input name="confirmPassword" id="confirmPassword" class="input-style" type="password" placeholder="Повторите пароль..." required>
          <div id="message"></div>
          <div class="registration-button-container">
            <button type="submit" class="registration-button">Регистрация</button>
          </div>
        </form>
      </div>
      <h1 class="title">Выбери свой продукт</h1>
        <div class="button-container">
          <button id="change-card-color-button" class="change-color-button">Сменить цвет первой карточки</button>
          <button id="change-color-all-cards-button" class="button-change-color-all-cards">Сменить цвет всех карточек</button>
          <button id="open-google-page-button" class="open-google-button">Перейти на страницу Google.com</button>
          <button id="multi-colored-button" class="multi-colored-button">Сменить цвет кнопки</button>
          <div id="modal-background" class="modal-background"></div>
          <div id="modal-dialog" class="modal modal-bg-img">
            <div class="modal-container">
                <div class="modal-button-container">
                  <button id="close-modal-window" class="close-modal-window"><img src="/assets/close-marker.svg" alt="Значок крестика"></button>
                </div>
              <div class="modal-form-container">
                <form id="modal-sign-form" class="modal-input-container">
                  <label for="modal-login" class="modal-label">
                    Введите логин: <input id="modal-login" type="text" class="modal-input" placeholder="Введите логин..." name="login" required>
                  </label>
                  <label for="modal-password" class="modal-label">
                    Введите пароль: <input id="modal-password" type="password" class="modal-input" placeholder="Введите пароль..." name="password" required>
                  </label>
                  <div>
                    <button id="modal-submit-button" type="submit" class="modal-sign-button">Войти</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <button id="auth-button" class="auth-button">Аутентификация</button>
        </div>
      <ul class="cards-container"></ul>
    </div>
  </main>

  <template id="product-card-template">
    <div class="product_card">
      <img class="product-image">
      <span class="skin-type"></span>
      <h3 class="product-name"></h3>
      <p id="product-description"></p>
      <span class="compound">Состав:</span>
      <ul id="composition" class="product-composition"></ul>
      <div class="product-card-price">
        <span class="product-card-price-label">Цена</span>
        <span class="product-card-price-value"></span>
      </div>
    </div>
  </template>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-left">
        <span class="product-cards white-text-color">Product Cards</span>
        <span class="marketing-text white-text-color">У нас самые лучшие продукты для кожи!</span>
        <div class="icon-container">
          <img src="/assets/telegram-icon.svg" alt="Иконка Телеграма" width="21px" height="17.61px">
          <img src="/assets/vk-icon.svg" alt="Иконка Вконтакте" width="24px" height="14px">
        </div>
      </div>
      <div class="footer-middle">
        <span class="action-subcribe white-text-color">Подпишись на наши акции:</span>
        <form class="input-container" id="email-form">
          <input name="email" type="email" class="email-input" placeholder="Введи Email..." required>
          <button type="submit" class="subcribe-button">Подписаться</button>
        </form>
      </div>
      <div class="footer-right">
        <h3 class="fast-links">Быстрые ссылки</h3>
        <nav>
          <ul class="links-container">
            <li><a href="#" class="links">Главная</a></li>
            <li><a href="#" class="links">Магазин</a></li>
            <li><a href="#" class="links">Контакты</a></li>
          </ul>
        </nav>
      </div>
    </div>
    <div class="footer-bottom">
      <hr class="footer-bottom-line"></hr>
      <a class="product-rights">www.product-cards.com©all right reserve</a>
    </div>
  </footer>

  <script src="/scripts/main.js"></script>
  <script src="/scripts/homework-5.js"></script>
  <script src="/scripts/homework-6.js"></script>
  <script src="/scripts/homework-7.js" type="module"></script>
  <script src="/scripts/homework-8.js" type="module"></script>
  <script src="/scripts/homework-9.js"></script>
</body>
</html>
